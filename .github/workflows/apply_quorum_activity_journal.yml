name: apply quorum activity journal branch patch
on:
  push:
    branches: [feat/quorum-activity-journal]
    paths:
      - scripts/apply_quorum_activity_journal.py
      - WebMap/QuorumActivityJournal.cs
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/apply_quorum_activity_journal.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WebMap/Config.cs WebMap/WebMap.cs
          git commit -m "feat: emit optional local quorum activity events"
          git push
