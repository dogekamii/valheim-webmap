name: Repair release metadata branch

on:
  push:
    branches:
      - release/v2.7.3

permissions:
  contents: write

jobs:
  restore-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.7.3
          fetch-depth: 0
      - name: Restore tracked project files and align lockfile metadata
        run: |
          git fetch origin main
          git checkout origin/main -- WebMap/WebMap.cs WebMap/WebMap.csproj
          sed -i 's/public const string VERSION = "2\.7\.2";/public const string VERSION = "2.7.3";/' WebMap/WebMap.cs
          sed -i 's/<Version>2\.7\.2<\//<Version>2.7.3<\//' WebMap/WebMap.csproj
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '2.7.3';
          lock.packages[''].version = '2.7.3';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          rm .github/workflows/release-version-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WebMap/WebMap.cs WebMap/WebMap.csproj package-lock.json .github/workflows/release-version-repair.yml
          git commit -m 'release: restore project files and align v2.7.3 lockfile'
          git push origin HEAD:release/v2.7.3
