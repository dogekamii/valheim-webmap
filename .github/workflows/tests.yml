name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  static-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build browser bundle
        run: |
          npm ci
          npm run build
      - name: Run static regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: docker build --build-arg BEPINEX_RELEASE=5.4.23.2 --tag webmap-release-build .
      - name: Build release output
        run: docker run --rm --volume "$PWD:/build" --workdir /build webmap-release-build ./build.sh --configuration Release
      - name: Verify release build output
        run: |
          test -s WebMap/bin/Release/net48/WebMap.dll
          test -s WebMap/bin/Release/net48/websocket-sharp.dll
          test -n "$(find WebMap/web -maxdepth 1 -name 'main.*.js' -size +0c -print -quit)"
          test ! -e WebMap/web/main.js
      - name: Reject compile-only DLLs from release output
        run: |
          unexpected="$(find WebMap/bin/Release/net48 -maxdepth 1 -type f -name '*.dll' ! -name 'WebMap.dll' ! -name 'websocket-sharp.dll' -print -quit)"
          test -z "$unexpected"
      - name: Inspect packaged privacy boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          bundles = list(Path("WebMap/web").glob("main.*.js"))
          assert len(bundles) == 1, bundles
          bundle_text = bundles[0].read_text(encoding="utf-8")
          assert "console." not in bundle_text

          plugin = Path("WebMap/bin/Release/net48/WebMap.dll")
          dependency = Path("WebMap/bin/Release/net48/websocket-sharp.dll")
          assert plugin.is_file() and plugin.stat().st_size > 0
          assert dependency.is_file() and dependency.stat().st_size > 0
          plugin_bytes = plugin.read_bytes()
          forbidden_markers = (
              "GetServerIP",
              "HandleRoutedRPC:",
              "WebMap: (say)",
              "WebMap: (chat)",
              "WebMap: (ping)",
              "WebMap::DiscordWebHook::SendMessage",
              "player _",
          )
          for marker in forbidden_markers:
              assert marker.encode("utf-8") not in plugin_bytes, marker
              assert marker.encode("utf-16-le") not in plugin_bytes, marker

          print(f"Inspected {bundles[0].name}, WebMap.dll, and websocket-sharp.dll inventory")
          PY
