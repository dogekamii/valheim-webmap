name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Audit npm dependencies
        run: npm audit
      - name: Build browser bundle
        run: |
          npm ci
          npm run build
      - name: Run static regression tests
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps --requirement requirements-ci.txt
          python -m pytest tests

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release image
        run: docker build --build-arg BEPINEX_RELEASE=5.4.23.2 --tag webmap-release-build .
      - name: Build release output
        run: docker run --rm --volume "$PWD:/build" --workdir /build webmap-release-build ./build.sh --configuration Release
      - name: Verify release build output
        run: |
          test -s WebMap/bin/Release/net48/WebMap.dll
          test -s WebMap/bin/Release/net48/websocket-sharp.dll
          test -n "$(find WebMap/web -maxdepth 1 -name 'main.*.js' -size +0c -print -quit)"
          test ! -e WebMap/web/main.js
      - name: Reject compile-only DLLs from release output
        run: |
          unexpected="$(find WebMap/bin/Release/net48 -maxdepth 1 -type f -name '*.dll' ! -name 'WebMap.dll' ! -name 'websocket-sharp.dll' -print -quit)"
          test -z "$unexpected"
