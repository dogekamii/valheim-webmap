name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  static-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run static regression tests
        run: |
          python tests/test_current_valheim_lifecycle.py
          python tests/test_visibility_modes.py
