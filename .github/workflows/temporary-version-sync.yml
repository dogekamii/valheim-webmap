name: Temporary 2.7.4 metadata sync

on:
  push:
    branches: [fix/review-security-privacy-packaging]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Synchronize candidate metadata
        run: python scripts/bump-2.7.4.py
      - name: Commit candidate metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WebMap/WebMap.cs WebMap/WebMap.csproj manifest.json package.json package-lock.json README.md CHANGELOG.md
          git commit -m "chore: bump release candidate metadata to 2.7.4"
          git push
