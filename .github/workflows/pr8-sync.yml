name: Synchronize PR 8 with reviewed base

on:
  push:
    branches: [automation/pr8-sync-00700a0]

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build and push semantic merge
        env:
          BASE_SHA: 00700a06e9cb6deb9b30a5e0383cb80b76906928
          OLD_HEAD_SHA: 749fe877cce41fa02ae40e6b1921b8c9704b2b1b
          TARGET_BRANCH: fix/public-identity-webhook-privacy
          TEMP_BRANCH: automation/pr8-sync-00700a0
        run: |
          set -euo pipefail
          diagnose() {
            rc=$?
            trap - ERR
            failed_command="$BASH_COMMAND"
            {
              echo "exit=$rc"
              echo "command=$failed_command"
              echo "status:"
              git status --short || true
              echo "unmerged:"
              git diff --name-only --diff-filter=U || true
            } > /tmp/pr8-sync-diagnostic.txt
            git merge --abort || true
            git checkout -B "$TEMP_BRANCH" "origin/$TEMP_BRANCH"
            mkdir -p .github/scripts
            cp /tmp/pr8-sync-diagnostic.txt .github/scripts/pr8-sync-diagnostic.txt
            git add .github/scripts/pr8-sync-diagnostic.txt
            git commit -m "ci: record PR 8 sync failure [skip ci]"
            git push origin "$TEMP_BRANCH"
            exit "$rc"
          }
          trap diagnose ERR
          cp .github/scripts/pr8-sync.py /tmp/pr8-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$BASE_SHA"
          git merge --no-commit --no-ff "$OLD_HEAD_SHA" || true
          unmerged="$(git diff --name-only --diff-filter=U | sort)"
          unexpected="$(printf '%s\n' "$unmerged" | grep -Ev '^(\.github/workflows/tests\.yml|WebMap/MapDataServer\.cs|WebMap/WebMap\.cs)$' || true)"
          test -z "$unexpected"
          if git ls-files -u -- .github/workflows/tests.yml | grep -q .; then git checkout --ours .github/workflows/tests.yml; fi
          if git ls-files -u -- WebMap/MapDataServer.cs | grep -q .; then git checkout --theirs WebMap/MapDataServer.cs; fi
          if git ls-files -u -- WebMap/WebMap.cs | grep -q .; then git checkout --theirs WebMap/WebMap.cs; fi
          python /tmp/pr8-sync.py
          git add .github/workflows/tests.yml WebMap/MapDataServer.cs WebMap/WebMap.cs
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git status --short
          git commit -m "chore: merge latest security/privacy base"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git push origin --delete "$TEMP_BRANCH"
