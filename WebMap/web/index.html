<!DOCTYPE html>
<html lang="en">
<head>
    <title>Valheim WebMap</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div data-id="map" class="map">
        <canvas data-id="canvas"></canvas>
        <svg class="mapBorder" data-id="mapBorder" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <circle data-id="mapBorderCircle" cx="500" cy="500" r="500" fill="none" stroke="#55F" stroke-opacity="50%" stroke-width="2"></circle>
        </svg>
    </div>
    <div data-id="coords" class="mapText coords"></div>
    <div data-id="menuBtn" class="menu-btn" role="button" aria-label="Map options">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div data-id="menu" class="menu">
        <div class="inputRow">Players online: <span data-id="onlineCount">0</span></div>
        <label class="inputRow"><input type="checkbox" class="hideIconTypeCheckbox" data-id="hideAll" data-hide="all">Hide all pins</label>
        <label class="inputRow"><input type="checkbox" class="hideIconTypeCheckbox" data-hide="dot">Hide all <span class="mapIcon dot menuMapIcon"></span></label>
        <label class="inputRow"><input type="checkbox" class="hideIconTypeCheckbox" data-hide="house">Hide all <span class="mapIcon house menuMapIcon"></span></label>
        <label class="inputRow"><input type="checkbox" class="hideIconTypeCheckbox" data-hide="fire">Hide all <span class="mapIcon fire menuMapIcon"></span></label>
        <label class="inputRow"><input type="checkbox" class="hideIconTypeCheckbox" data-hide="cave">Hide all <span class="mapIcon cave menuMapIcon"></span></label>
        <label class="inputRow"><input type="checkbox" class="hideIconTypeCheckbox" data-hide="mine">Hide all <span class="mapIcon mine menuMapIcon"></span></label>
    </div>
    <script src="main.js"></script>
</body>
</html>
